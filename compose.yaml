name: feedbackos

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_DB: ${FEEDBACKOS_POSTGRES_DB:-feedbackos}
      POSTGRES_USER: ${FEEDBACKOS_POSTGRES_USER:-feedbackos}
      POSTGRES_PASSWORD: ${FEEDBACKOS_POSTGRES_PASSWORD:-feedbackos_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackos -d feedbackos"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    init: true
    environment:
      # 仅供本机开发使用，测试/生产必须由外部密钥管理提供不同值。
      GARAGE_RPC_SECRET: ${FEEDBACKOS_GARAGE_RPC_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_ACCESS_KEY: ${FEEDBACKOS_STORAGE_ACCESS_KEY_ID:-GK0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_SECRET_KEY: ${FEEDBACKOS_STORAGE_SECRET_ACCESS_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      GARAGE_DEFAULT_BUCKET: ${FEEDBACKOS_STORAGE_BUCKET:-feedbackos-dev-private}
    ports:
      - "127.0.0.1:3900:3900"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "json-api", "GetClusterHealth"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
    name: feedbackos_postgres_data
  garage_meta:
    name: feedbackos_garage_meta
  garage_data:
    name: feedbackos_garage_data
