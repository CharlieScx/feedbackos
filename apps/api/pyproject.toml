[project]
name = "feedbackos-api"
version = "0.1.0"
description = "FeedbackOS HTTP API and import foundation"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.19.2",
  "argon2-cffi>=25.1,<26",
  "boto3>=1.40,<2",
  "email-validator>=2.3,<3",
  "fastapi==0.141.1",
  "openpyxl==3.1.5",
  "polars==1.44.2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic==2.13.5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "sqlalchemy==2.0.52",
  "structlog>=25.4,<26",
  "uvicorn[standard]>=0.37,<0.40",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.13,<0.16",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedbackos_api"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["feedbackos_api"]
